<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeConnect Registration</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f4f4;
    }

    .container {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 25px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    .notice {
      background: #f1f1f1;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      background: #111;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .back {
      text-align: center;
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Join SafeConnect</h1>

  <p class="subtitle">
    Create your verified dating profile
  </p>

  <form>

    <label>First name</label>
    <input type="text" placeholder="Enter your first name" required>

    <label>Date of birth</label>
    <input type="date" required>

    <label>Email address</label>
    <input type="email" placeholder="Enter your email" required>

    <label>Phone number</label>
    <input type="tel" placeholder="Enter your phone number" required>

    <label>Password</label>
    <input type="password" placeholder="Create a password" required>

    <label>Gender</label>
    <select required>
      <option value="">Select your gender</option>
      <option>Man</option>
      <option>Woman</option>
      <option>Trans man</option>
      <option>Trans woman</option>
      <option>Non-binary</option>
      <option>Other</option>
    </select>

    <label>Who are you interested in?</label>
    <select required>
      <option value="">Select preference</option>
      <option>Men</option>
      <option>Women</option>
      <option>Men and women</option>
      <option>All genders</option>
    </select>

    <div class="notice">
      🪪 <strong>Identity verification</strong><br><br>
      SafeConnect will require identity verification before a user can access the full dating platform.
      This helps reduce fake accounts and impersonation.
    </div>

    <button type="submit">
      Continue to Identity Verification
    </button>

  </form>

  <div class="back">
    Already have an account? Log in
  </div>

</div>

</body>
  </html>
